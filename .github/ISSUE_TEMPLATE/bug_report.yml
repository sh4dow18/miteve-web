name: "🐛 Reportar Error"
description: "Reportar un bug o error en MiTeVe-Web"
labels: ["Bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar un bug. Por favor completa la información para ayudarnos a reproducirlo.

  - type: textarea
    id: description
    attributes:
      label: "Descripción"
      description: "Descripción detallada del bug"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Pasos para reproducir"
      description: "Pasos para reproducir el error"
      placeholder: |
        1. Ir a '...'
        2. Hacer clic en '...'
        3. Ver error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Comportamiento esperado"
      description: "Qué debería pasar"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Comportamiento actual"
      description: "Qué pasa actualmente"
    validations:
      required: true

  - type: checkboxes
    id: objetivo
    attributes:
      label: "Objetivo"
      description: "Ruta(s) / objetivo(s) afectado(s). Selecciona uno o varios."
      options:
        - label: "Home"
        - label: "Search"
        - label: "Player"
        - label: "Downloads"
        - label: "Profile"
        - label: "Admin"
        - label: "Auth"
        - label: "API"
        - label: "SEO"
        - label: "UI"
        - label: "General"
    validations:
      required: true

  - type: dropdown
    id: reportado_por
    attributes:
      label: "Reportado por"
      description: "¿Quién reporta el issue?"
      options:
        - MiTeVe Team
        - QA
        - Usuario
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: "Capturas"
      description: "Agregar screenshots/evidencia"
    validations:
      required: true
