name: "✨ Solicitar Nueva Funcionalidad"
description: "Solicitar una nueva funcionalidad para MiTeVe-Web"
labels: ["Solicitud"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por proponer una nueva funcionalidad.

  - type: textarea
    id: user_story
    attributes:
      label: "Historia de Usuario"
      description: "Formato: Como [rol], Quiero [funcionalidad], Para [beneficio]"
      placeholder: |
        **Como** usuario registrado
        **Quiero** poder descargar un capítulo
        **Para** verlo sin conexión a internet
    validations:
      required: true

  - type: textarea
    id: Como
    attributes:
      label: "Como"
      description: "Rol del usuario (ej: visitante, usuario registrado, administrador)"
      placeholder: "Como usuario registrado"
    validations:
      required: true

  - type: textarea
    id: Quiero
    attributes:
      label: "Quiero"
      description: "Funcionalidad o acción deseada"
      placeholder: "Quiero poder descargar un capítulo"
    validations:
      required: true

  - type: textarea
    id: Para
    attributes:
      label: "Para"
      description: "Beneficio o propósito"
      placeholder: "Para verlo sin conexión a internet"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Descripción"
      description: "Descripción detallada de la funcionalidad"
    validations:
      required: true

  - type: textarea
    id: criteria
    attributes:
      label: "Criterios de Aceptación"
      description: "Checklist de lo que debe cumplir"
      placeholder: |
        - [ ] Criterio 1
        - [ ] Criterio 2
    validations:
      required: true

  - type: checkboxes
    id: objetivo
    attributes:
      label: "Objetivo"
      description: "Ruta(s) / objetivo(s) donde va la funcionalidad. Selecciona uno o varios."
      options:
        - label: "Home"
        - label: "Search"
        - label: "Player"
        - label: "Downloads"
        - label: "Profile"
        - label: "Admin"
        - label: "Auth"
        - label: "API"
        - label: "SEO"
        - label: "UI"
        - label: "General"
    validations:
      required: true

  - type: dropdown
    id: reportado_por
    attributes:
      label: "Reportado por"
      description: "¿Quién reporta el issue?"
      options:
        - MiTeVe Team
        - QA
        - Usuario
    validations:
      required: true

  - type: textarea
    id: mockups
    attributes:
      label: "Mockups"
      description: "Mockups, diseños o enlaces a Figma (opcional)"
    validations:
      required: false
